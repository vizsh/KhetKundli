# Every push and pull request: types, lint, the unit and property tests (embedded Postgres, no service
# needed), the crash test, the slip parser and the router parity. The browser smoke test needs Chrome and
# a running server; it runs on the demo laptop (npm run smoke) until a browser job is added.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npx eslint src
      - run: npm test
      - run: npm run test:crash
      - run: npm run test:slips
      - run: npm run test:router
      - run: npx tsx --tsconfig tsconfig.json scripts/simtest.ts
